<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WansTeknik - Power Grid Master</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 31, 48, 0.8);
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --success: #00e676;
      --text: #f0f6fc;
      --muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.2rem;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .device-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .device-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .device-card.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .device-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .device-name {
      font-size: 0.85rem;
      text-align: center;
      font-weight: 600;
    }

    .switch-status {
      margin-top: 10px;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--muted);
    }

    .device-card.active .switch-status {
      background: var(--success);
      color: #000;
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      height: 24px;
      margin-bottom: 15px;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⚡ WansTeknik Power Grid</h1>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Level</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Skor</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Waktu</span>
        <span class="stat-value" id="time">30s</span>
      </div>
    </div>

    <div class="message" id="message">Nyalakan semua sakelar untuk naik level!</div>

    <div class="grid" id="deviceGrid"></div>

    <button class="btn" id="startBtn" onclick="startGame()">MULAI PERMAINAN</button>
  </div>

  <script>
    const devicePool = [
      { name: "Lampu Kamar", icon: "💡" },
      { name: "Kipas Angin", icon: "🌀" },
      { name: "Televisi", icon: "📺" },
      { name: "Kulkas", icon: "🧊" },
      { name: "AC Ruangan", icon: "❄️" },
      { name: "Komputer", icon: "🖥️" },
      { name: "Dispensern", icon: "🚰" },
      { name: "Rice Cooker", icon: "🍚" },
      { name: "Mesin Cuci", icon: "🧺" }
    ];

    let level = 1;
    let score = 0;
    let timeLeft = 30;
    let gameActive = false;
    let timerInterval = null;
    let currentDevices = [];

    // Web Audio API Sederhana
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function startGame() {
      level = 1;
      score = 0;
      timeLeft = 30;
      gameActive = true;
      
      document.getElementById('startBtn').style.display = 'none';
      updateUI();
      
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      buildLevel();
    }

    function buildLevel() {
      // Tentukan jumlah sakelar berdasarkan level (mulai dari 3 sakelar, maks 8)
      const count = Math.min(3 + Math.floor((level - 1) / 2), 8);
      
      // Acak sakelar dari pool
      const shuffled = [...devicePool].sort(() => 0.5 - Math.random());
      currentDevices = shuffled.slice(0, count).map((dev, idx) => ({
        id: idx,
        name: dev.name,
        icon: dev.icon,
        active: false
      }));

      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('deviceGrid');
      grid.innerHTML = '';

      currentDevices.forEach(dev => {
        const card = document.createElement('div');
        card.className = `device-card ${dev.active ? 'active' : ''}`;
        card.onclick = () => toggleDevice(dev.id);

        card.innerHTML = `
          <div class="device-icon">${dev.icon}</div>
          <div class="device-name">${dev.name}</div>
          <div class="switch-status">${dev.active ? 'ON' : 'OFF'}</div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleDevice(id) {
      if (!gameActive) return;

      const device = currentDevices.find(d => d.id === id);
      if (!device) return;

      device.active = !device.active;
      playBeep(device.active ? 600 : 300, 'sine', 0.08);

      if (device.active) {
        score += 10;
      } else {
        score = Math.max(0, score - 5);
      }

      renderGrid();
      updateUI();

      // CEK NAIK LEVEL: Jika SEMUA perangkat di ronde ini dalam posisi ON
      const allActive = currentDevices.every(d => d.active);
      if (allActive) {
        playBeep(880, 'triangle', 0.2);
        level++;
        score += 50; // Bonus skor penyelesaian ronde
        timeLeft = Math.min(timeLeft + 6, 45); // Bonus waktu +6 detik
        
        document.getElementById('message').innerText = `🎉 STAGE CLEAR! Naik ke Level ${level} (+6s)`;
        
        // Transisi halus ke ronde berikutnya
        setTimeout(() => {
          if (gameActive) {
            document.getElementById('message').innerText = "Nyalakan semua sakelar!";
            buildLevel();
          }
        }, 500);
      }
    }

    function updateTimer() {
      if (!gameActive) return;
      timeLeft--;
      updateUI();

      if (timeLeft <= 0) {
        endGame();
      }
    }

    function updateUI() {
      document.getElementById('level').innerText = level;
      document.getElementById('score').innerText = score;
      document.getElementById('time').innerText = `${timeLeft}s`;
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      playBeep(150, 'sawtooth', 0.4);

      document.getElementById('deviceGrid').innerHTML = '';
      document.getElementById('message').innerText = `GAME OVER! Kamu mencapai Level ${level} dengan Skor ${score}`;
      
      const startBtn = document.getElementById('startBtn');
      startBtn.style.display = 'block';
      startBtn.innerText = 'MAIN LAGI';
    }
  </script>
</body>
</html>
